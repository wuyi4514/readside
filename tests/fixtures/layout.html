<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive reading layouts</title><link rel="stylesheet" href="/layout.css"></head><body><main>
<h1>Reading across changing layouts</h1>
<div class="carousel" id="carousel"><div class="spacer" aria-hidden="true"></div><article class="quote-card"><blockquote id="carousel-quote">A thoughtful reading experience makes it easier to discover new ideas and understand the people around us.</blockquote></article></div>
<section class="resizable" id="resizable"><p id="expanding-copy">People can learn something useful every day by reading carefully and sharing their ideas with one another.</p></section>
<button id="expand" type="button">Expand the reading area</button>
<section class="column-heading"><h2 id="column-heading">A better way to read and understand the world.</h2></section>
</main><script src="/layout.js"></script></body></html>
