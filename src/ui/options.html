<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Readside · 设置</title><link rel="stylesheet" href="ui.css"></head>
<body class="options">
  <div class="options-shell">
    <header class="options-head"><a class="brand" href="options.html"><img src="icons/48.png" width="36" height="36" alt=""><strong>Readside</strong></a></header>
    <main class="options-main">
      <aside class="introduction">
        <h1>网页对照翻译</h1>
        <p class="intro-copy">保留原文，在下方显示译文。读外文网站时，逐段对照理解，也可以选中词句查看翻译。</p>
        <div class="reading-scene" aria-label="对照阅读示例">
          <span class="sample-caption">对照阅读</span>
          <p class="sample-original" lang="en">Small details can change how we see the world.</p>
          <p class="sample-translation" lang="zh-CN">微小的细节，也能改变我们看待世界的方式。</p>
        </div>
      </aside>
      <div class="preferences" aria-label="阅读设置">
        <section class="setting-section"><h2>翻译语言</h2><div class="options-language"><div><span class="field-label">源语言（可多选）</span><div id="source" class="product-select"></div></div><span class="language-arrow" aria-hidden="true">→</span><div><span class="field-label">目标语言</span><div id="target" class="product-select"></div></div></div><p class="helper">只翻译识别为源语言的内容。</p><div id="language-packs" class="language-packs" aria-label="语言包"></div><p id="engine-state" class="engine-state" role="status">正在检查语言包…</p></section>
        <section class="setting-section"><h2>自动翻译</h2><fieldset class="choice-row automatic-choice" id="auto-controls" disabled><legend>自动翻译网页</legend><div class="radio-options"><label><input id="auto-on" name="auto" type="radio" value="on">开启</label><label><input id="auto-off" name="auto" type="radio" value="off">关闭</label></div></fieldset><fieldset class="choice-row" id="all-sites-controls" disabled><legend>在所有网站自动翻译</legend><div class="radio-options"><label><input id="all-sites-yes" name="all-sites" type="radio" value="on">是</label><label><input id="all-sites-no" name="all-sites" type="radio" value="off">否</label></div></fieldset><p id="permission-state" class="helper"></p></section>
        <section class="setting-section"><h2>阅读设置</h2><fieldset class="choice-row selection-choice"><legend>选择词句后查译</legend><div class="radio-options"><label><input id="selection-on" name="selection" type="radio" value="on">开启</label><label><input id="selection-off" name="selection" type="radio" value="off">关闭</label></div></fieldset><div class="setting-line"><span>译文最小字号</span><div id="font-size" class="product-select font-select"></div></div></section>
        <section class="setting-section" id="rules-section" hidden><h2>已设置的网站</h2><div id="site-rules" class="rules-list"></div></section>
        <div class="settings-bottom"><button id="clear-cache" class="button secondary small">清除翻译缓存</button><p id="message" class="message" role="status" hidden></p></div>
      </div>
    </main>
    <footer class="options-footer"><div><a href="https://github.com/wuyi4514/parallel-read" target="_blank" rel="noreferrer">GitHub</a><a href="https://github.com/wuyi4514/parallel-read/blob/main/PRIVACY.md" target="_blank" rel="noreferrer">隐私说明</a></div><span id="version">v0.2.1</span></footer>
  </div><script type="module" src="options.js"></script>
</body></html>
