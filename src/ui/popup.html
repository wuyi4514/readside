<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>对照读</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header class="popup-head"><div class="brand"><img src="icons/48.png" width="30" height="30" alt=""><div><strong>对照读</strong><span>PARALLEL READ</span></div></div><button class="icon-button" id="settings" title="阅读设置" aria-label="打开阅读设置">⚙</button></header>
  <main>
    <section class="master-row"><div><h1>自动对照</h1><p>读英文，有中文相伴。</p></div><button id="auto" class="switch" role="switch" aria-checked="false" aria-label="自动翻译"><span></span></button></section>
    <div class="page-status" id="status" role="status"><span class="status-dot"></span><span id="status-text">正在连接…</span></div>
    <button id="retry" class="text-button" hidden>重试未完成内容</button>
    <section class="language-row" aria-label="翻译语言"><label><span class="field-label">仅翻译此语言</span><select id="source" aria-label="仅翻译此语言"></select></label><span class="language-arrow" aria-hidden="true">→</span><div><span class="field-label">译为</span><span class="target-label">简体中文</span></div></section>
    <div class="page-actions"><button id="translate" class="button primary">翻译当前页 <span aria-hidden="true">↗</span></button><button id="restore" class="button secondary">恢复原文</button></div>
    <p id="message" class="message" role="status" hidden></p>
    <div class="site-row"><div><span class="field-label">此网站</span><span id="site" class="site-name">当前页面</span></div><select id="site-rule" aria-label="此网站的自动翻译规则"><option value="follow-global">跟随全局</option><option value="always">始终翻译</option><option value="never">不自动翻译</option></select></div>
    <div class="selection-row"><label for="selection">选择词句后查译</label><input type="checkbox" id="selection" class="checkbox"></div>
  </main>
  <footer class="popup-footer"><span>原文保留 · 本地翻译</span><button id="options" class="text-button">阅读设置 <span aria-hidden="true">↗</span></button></footer>
  <script type="module" src="popup.js"></script>
</body></html>
